# Ping anti-pause Supabase (plan gratuit : pause après ~7 jours sans activité).
# Remplace les crons Vercel, qui ne se déclenchaient plus de façon fiable depuis début novembre 2026.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions) :
#   SUPABASE_URL               ex. https://wksblmccugdmiafqzajd.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  clé service_role (Supabase → Project Settings → API)
#
# Chaque passage : 1 insertion dans keepalive_log + lectures sur les tables métier
# + purge des lignes de plus de 90 jours. Le job échoue (et GitHub envoie un email)
# si une seule requête ne renvoie pas un code 2xx.
#
# Les workflows planifiés ne tournent que depuis la branche par défaut (main).

name: keepalive-supabase

on:
  schedule:
    - cron: "17 5 * * *"   # 06h17 / 07h17 heure de Paris
    - cron: "43 16 * * *"  # 17h43 / 18h43 heure de Paris
  workflow_dispatch: {}     # bouton « Run workflow » pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::Secrets SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY manquants"; exit 1
          fi

          appel() { # méthode chemin [corps]
            local code
            code=$(curl -sS -o /tmp/rep -w '%{http_code}' -X "$1" "$URL/rest/v1/$2" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" \
              ${3:+-d "$3"})
            echo "$1 $2 → $code"
            if [ "${code:0:1}" != "2" ]; then cat /tmp/rep; echo; exit 1; fi
          }

          appel POST keepalive_log "{\"source\":\"github-actions\"}"
          appel GET  "parametres?select=*&limit=1"
          appel GET  "clients?select=id&limit=5"
          appel GET  "documents?select=id&limit=5"
          appel DELETE "keepalive_log?le=lt.$(date -u -d '90 days ago' +%Y-%m-%dT%H:%M:%SZ)"
